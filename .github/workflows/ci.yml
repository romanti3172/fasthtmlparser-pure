name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python: "pypy3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q

  # Every library of the benchmark must extract the same records.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install . fasthtmlparser selectolax lxml parsel beautifulsoup4
      - run: python bench/bench.py --check

  # The wheel and the sdist (pure Python: one wheel for every platform).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          m=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('fasthtmlparser_pure/__init__.py').read())[1])")
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$m" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $v, __version__ $m: they must match"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # A version tag (v0.1.0) publishes to PyPI with trusted publishing: no token is stored in the repository.
  # PyPI must list this repository, this workflow (ci.yml) and the environment "pypi" as a trusted publisher.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bench, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
