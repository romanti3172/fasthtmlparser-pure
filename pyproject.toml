[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fasthtmlparser-pure"
version = "0.1.0"
description = "Fast HTML / XML parser for scraping with XPath 1.0 and CSS selectors, in pure Python. A port of z3l.FastHtmlParser."
readme = "README.md"
license = "LicenseRef-z3l-FastHtmlParser"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "z3l" }]
keywords = ["html", "parser", "xpath", "css", "selectors", "scraping", "web-scraping", "pure-python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/romanti3172/fasthtmlparser-pure"
Source = "https://github.com/romanti3172/fasthtmlparser-pure"
Issues = "https://github.com/romanti3172/fasthtmlparser-pure/issues"

[tool.setuptools]
packages = ["fasthtmlparser_pure"]

[tool.setuptools.package-data]
fasthtmlparser_pure = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
